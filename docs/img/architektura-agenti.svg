<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="600" fill="#ffffff"/>

  <!-- User -->
  <rect x="250" y="20" width="160" height="48" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="330" y="49" text-anchor="middle" font-size="14" fill="#1a1a1a">Uživatel (prohlížeč)</text>

  <line x1="330" y1="68" x2="330" y2="106" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="342" y="91" font-size="11" fill="#555">SSO (OAuth2 / EntraID)</text>

  <!-- OWUI -->
  <rect x="230" y="108" width="200" height="52" rx="8" fill="#d7f0db" stroke="#34a853" stroke-width="1.5"/>
  <text x="330" y="140" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="bold">Open-WebUI (OWUI)</text>

  <!-- three branches -->
  <line x1="290" y1="160" x2="130" y2="226" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="330" y1="160" x2="330" y2="226" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="370" y1="160" x2="530" y2="226" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Agent -->
  <rect x="50" y="228" width="160" height="50" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="130" y="258" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">Agent</text>

  <!-- Web search -->
  <rect x="250" y="228" width="160" height="50" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="330" y="258" text-anchor="middle" font-size="13" fill="#1a1a1a">Web search</text>

  <!-- Models via LiteLLM -->
  <rect x="450" y="228" width="170" height="50" rx="8" fill="#e8e0fe" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="535" y="252" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="bold">Modely</text>
  <text x="535" y="268" text-anchor="middle" font-size="11" fill="#666">přes LiteLLM</text>

  <!-- Agent (1) calls model -->
  <path d="M210,243 C330,205 420,205 450,243" fill="none" stroke="#7e57c2" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
  <text x="300" y="200" text-anchor="middle" font-size="11" fill="#7e57c2">(1) volá model přes LiteLLM</text>

  <!-- Agent (2) calls tool -->
  <line x1="130" y1="278" x2="130" y2="338" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="142" y="312" font-size="11" fill="#555">(2) volá nástroj / zdroj</text>

  <!-- MCP server -->
  <rect x="40" y="340" width="220" height="56" rx="8" fill="#e0f7fa" stroke="#00acc1" stroke-width="1.5"/>
  <text x="150" y="364" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">MCP Server: &lt;doména&gt;</text>
  <text x="150" y="382" text-anchor="middle" font-size="10" fill="#666">brána ke zdrojům (přes OpenAPI / proxy)</text>

  <!-- OBO arrow -->
  <line x1="150" y1="396" x2="150" y2="452" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="162" y="428" font-size="11" fill="#c1185b">OBO – jménem uživatele</text>

  <!-- Target system -->
  <rect x="30" y="454" width="240" height="56" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
  <text x="150" y="478" text-anchor="middle" font-size="13" fill="#1a1a1a">Cílový systém</text>
  <text x="150" y="496" text-anchor="middle" font-size="10" fill="#666">CRM, HR, ServiceDesk, …</text>

  <!-- caption -->
  <text x="330" y="555" text-anchor="middle" font-size="11" fill="#999">Plánované rozšíření – agent kombinuje model (LiteLLM), nástroje přes MCP bránu</text>
  <text x="330" y="572" text-anchor="middle" font-size="11" fill="#999">a znalostní bázi (RAG). Volání zdrojů probíhá on-behalf-of přihlášeného uživatele.</text>
</svg>
