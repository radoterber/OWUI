<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="520" fill="#ffffff"/>

  <!-- User -->
  <rect x="240" y="20" width="160" height="48" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="320" y="49" text-anchor="middle" font-size="14" fill="#1a1a1a">Uživatel (prohlížeč)</text>

  <!-- SSO arrow -->
  <line x1="320" y1="68" x2="320" y2="108" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="332" y="92" font-size="11" fill="#555">SSO (OAuth2 / EntraID)</text>

  <!-- OWUI -->
  <rect x="220" y="110" width="200" height="52" rx="8" fill="#d7f0db" stroke="#34a853" stroke-width="1.5"/>
  <text x="320" y="142" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="bold">Open-WebUI (OWUI)</text>

  <!-- branches -->
  <line x1="280" y1="162" x2="130" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="162" x2="320" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="162" x2="510" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DB / vector -->
  <rect x="40" y="232" width="170" height="56" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="125" y="256" text-anchor="middle" font-size="13" fill="#1a1a1a">DB / vector</text>
  <text x="125" y="274" text-anchor="middle" font-size="10" fill="#666">interní úložiště, RAG</text>

  <!-- Web search -->
  <rect x="235" y="232" width="170" height="56" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="320" y="256" text-anchor="middle" font-size="13" fill="#1a1a1a">Web search</text>
  <text x="320" y="274" text-anchor="middle" font-size="10" fill="#666">řízené vyhledávání</text>

  <!-- LiteLLM -->
  <rect x="430" y="232" width="170" height="56" rx="8" fill="#e8e0fe" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="515" y="256" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">LiteLLM</text>
  <text x="515" y="274" text-anchor="middle" font-size="10" fill="#666">firemní LLM proxy</text>

  <!-- LiteLLM to models -->
  <line x1="515" y1="288" x2="515" y2="324" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="430" y="326" width="170" height="34" rx="6" fill="#f3eefe" stroke="#7e57c2" stroke-width="1.2"/>
  <text x="515" y="348" text-anchor="middle" font-size="12" fill="#1a1a1a">Model A</text>
  <rect x="430" y="368" width="170" height="34" rx="6" fill="#f3eefe" stroke="#7e57c2" stroke-width="1.2"/>
  <text x="515" y="390" text-anchor="middle" font-size="12" fill="#1a1a1a">Model B</text>
  <rect x="430" y="410" width="170" height="34" rx="6" fill="#f3eefe" stroke="#7e57c2" stroke-width="1.2"/>
  <text x="515" y="432" text-anchor="middle" font-size="12" fill="#1a1a1a">Model …</text>

  <!-- caption -->
  <text x="320" y="490" text-anchor="middle" font-size="11" fill="#999">OWUI – aktuálně funkční architektura. Veškerá komunikace v interní síti banky.</text>
</svg>
